<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemantauan Rapor Pendidikan PAUD · Dinas Pendidikan Kabupaten Sukoharjo</title>
<meta name="description" content="Pemantauan login dan akses Rapor Pendidikan Jenjang PAUD, Dinas Pendidikan Kabupaten Sukoharjo.">
<meta property="og:title" content="Pemantauan Rapor Pendidikan Jenjang PAUD">
<meta property="og:description" content="Dinas Pendidikan Kabupaten Sukoharjo">
<meta name="theme-color" content="#12306b">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f1f5fa; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #muat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #f1f5fa; font: 600 15px/1.5 Arial, sans-serif; color: #12306b; text-align: center; padding: 24px; transition: opacity .3s; }
  #muat img { width: 96px; height: 96px; animation: putar 7s linear infinite; }
  #muat small { font-weight: 400; color: #5b6b85; max-width: 420px; }
  #muat a { color: #1f5fd6; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #muat img { animation: none; } }
</style>
</head>
<body>
<div id="muat">
  <img src="/favicon.png" alt="">
  <div>Memuat aplikasi…</div>
  <small id="muatInfo"></small>
</div>
<iframe id="app" title="Pemantauan Rapor Pendidikan PAUD" allow="clipboard-write; fullscreen"></iframe>

<script>
  /* ====== SATU-SATUNYA YANG PERLU DIUBAH ======
     Tempel URL aplikasi web Apps Script (yang berakhiran /exec). */
  var URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbx3mAsWXmuPRpDOTQT_XohMiz_X7quP79PdjvYF1Pn5s9J8N-CWhN5z1hKUNoEqFIdXLw/exec';

  var muat = document.getElementById('muat'), info = document.getElementById('muatInfo'), app = document.getElementById('app');
  if (URL_APPS_SCRIPT.indexOf('GANTI_DENGAN') >= 0) {
    muat.querySelector('img').style.animation = 'none';
    muat.querySelector('div').textContent = 'Alamat Apps Script belum diisi.';
    info.textContent = 'Buka file index.html, ganti nilai URL_APPS_SCRIPT dengan URL aplikasi web (berakhiran /exec), lalu deploy ulang.';
  } else {
    // ?cek=1 dan parameter lain diteruskan ke Apps Script
    app.src = URL_APPS_SCRIPT + location.search;
    app.addEventListener('load', function () {
      muat.style.opacity = 0;
      setTimeout(function () { muat.style.display = 'none'; }, 300);
    });
    setTimeout(function () {
      if (muat.style.display !== 'none') {
        info.innerHTML = 'Koneksi agak lambat. Bila tidak kunjung tampil, <a href="' + URL_APPS_SCRIPT + '" rel="noopener">buka aplikasi langsung</a>.';
      }
    }, 20000);
  }
</script>
</body>
</html>
